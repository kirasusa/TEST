<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор</title>
<style>
  body { font: 1rem system-ui, sans-serif; margin: 2rem auto; padding: 0 1rem; max-width: 22rem; }
  form { display: grid; gap: 1rem; }
  label { display: grid; gap: .35rem; }
  input, select, button { font: inherit; padding: .6rem; }
  output { font-weight: bold; overflow-wrap: anywhere; }
</style>
<h1>Калькулятор</h1>
<form id="calculator">
  <label>Первое число <input name="first" type="number" step="any" required></label>
  <label>Действие
    <select name="operation">
      <option value="add">+ Сложение</option>
      <option value="subtract">− Вычитание</option>
      <option value="multiply">× Умножение</option>
      <option value="divide">÷ Деление</option>
    </select>
  </label>
  <label>Второе число <input name="second" type="number" step="any" required></label>
  <button>Посчитать</button>
  <output aria-label="Результат"></output>
</form>
<script>
  const form = document.querySelector('#calculator');
  const output = form.querySelector('output');
  const operations = {
    add: (a, b) => a + b,
    subtract: (a, b) => a - b,
    multiply: (a, b) => a * b,
    divide: (a, b) => a / b
  };

  form.addEventListener('input', () => { output.value = ''; });
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const { first, second, operation } = form.elements;
    const divisor = second.valueAsNumber;
    if (operation.value === 'divide' && divisor === 0) {
      output.value = 'На ноль делить нельзя';
      return;
    }

    const result = operations[operation.value](first.valueAsNumber, divisor);
    output.value = Number.isFinite(result)
      ? String(Number(result.toPrecision(15)))
      : 'Результат слишком большой';
  });
</script>
</html>
